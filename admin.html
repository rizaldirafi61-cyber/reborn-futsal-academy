<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Admin - Reborn Futsal Academy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="admin-page">

  <aside class="admin-sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark">RFA</span>
      <span>
        <strong>Reborn</strong>
        <small>Futsal Academy</small>
      </span>
    </a>

    <nav>
      <a href="admin.html" class="active">📊 Dashboard</a>
      <a href="index.html">🌐 Website</a>
    </nav>

    <button class="btn primary full" onclick="logout()">
      Logout
    </button>
  </aside>

  <main class="admin-main">

    <header class="admin-header">
      <div>
        <span class="eyebrow">ADMINISTRATOR</span>
        <h1>Dashboard</h1>
        <p class="muted">Kelola data pemain Reborn Futsal Academy.</p>
      </div>
    </header>

    <section class="admin-stats">

      <div class="stat-card">
        <span>Total Pemain</span>
        <strong id="totalPlayers">-</strong>
      </div>

      <div class="stat-card">
        <span>Pendaftar Baru</span>
        <strong id="newPlayers">-</strong>
      </div>

    </section>

    <section class="panel">

      <div class="panel-title">
        <div>
          <h2>Data Pendaftar</h2>
          <p class="muted">Data diambil langsung dari Supabase.</p>
        </div>

        <button class="btn primary small" onclick="loadPlayers()">
          ↻ Refresh
        </button>
      </div>

      <div id="loading" class="muted">
        Memuat data...
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>WhatsApp</th>
              <th>Program</th>
              <th>Tanggal Daftar</th>
            </tr>
          </thead>

          <tbody id="playersTable">
          </tbody>
        </table>
      </div>

      <p id="message" class="form-note"></p>

    </section>

  </main>

<script>
const SUPABASE_URL = 'https://txgwdcxsmgclbgbxdbsf.supabase.co';

const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_g3Tsr8PRmwhGvFcGGJOuOg_0R6zCrr6';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   CEK LOGIN
========================= */

async function checkAuth() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return false;
  }

  return true;
}


/* =========================
   LOAD DATA PEMAIN
========================= */

async function loadPlayers() {

  const loading = document.getElementById('loading');
  const table = document.getElementById('playersTable');
  const message = document.getElementById('message');

  loading.textContent = 'Memuat data...';
  table.innerHTML = '';
  message.textContent = '';

  const { data, error } = await supabaseClient
    .from('players')
    .select('full_name, phone, program, created_at')
    .order('created_at', { ascending: false });

  if (error) {

    loading.textContent = '';

    message.textContent =
      'Gagal mengambil data: ' + error.message;

    return;
  }

  loading.textContent = '';

  document.getElementById('totalPlayers').textContent =
    data.length;

  document.getElementById('newPlayers').textContent =
    data.length;

  if (data.length === 0) {

    table.innerHTML =
      '<tr><td colspan="4">Belum ada data pendaftar.</td></tr>';

    return;
  }

  data.forEach(player => {

    const row = document.createElement('tr');

    const date = player.created_at
      ? new Date(player.created_at).toLocaleDateString('id-ID')
      : '-';

    row.innerHTML = `
      <td>${escapeHtml(player.full_name || '-')}</td>
      <td>${escapeHtml(player.phone || '-')}</td>
      <td>${escapeHtml(player.program || '-')}</td>
      <td>${date}</td>
    `;

    table.appendChild(row);
  });
}


/* =========================
   CEGAH HTML INJECTION
========================= */

function escapeHtml(value) {

  const div = document.createElement('div');

  div.textContent = value;

  return div.innerHTML;
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = 'login.html';
}


/* =========================
   JALANKAN
========================= */

(async function () {

  const authenticated = await checkAuth();

  if (authenticated) {
    await loadPlayers();
  }

})();
</script>

</body>
</html>
