<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Admin - Reborn Futsal Academy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="admin-page">

  <aside class="admin-sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark">RFA</span>
      <span>
        <strong>Reborn</strong>
        <small>Futsal Academy</small>
      </span>
    </a>

    <nav>
      <a href="admin.html" class="active">📊 Dashboard</a>
      <a href="index.html">🌐 Website</a>
    </nav>

    <button class="btn primary full" onclick="logout()">
      Logout
    </button>
  </aside>

  <main class="admin-main">

    <header class="admin-header">
      <div>
        <span class="eyebrow">ADMINISTRATOR</span>
        <h1>Dashboard</h1>
        <p class="muted">Kelola data pemain Reborn Futsal Academy.</p>
      </div>
    </header>

    <section class="admin-stats">

      <div class="stat-card">
        <span>Total Pemain</span>
        <strong id="totalPlayers">-</strong>
      </div>

      <div class="stat-card">
        <span>Pendaftar Baru</span>
        <strong id="newPlayers">-</strong>
      </div>

    </section>

    <section class="panel">

      <div class="panel-title">
  <div>
    <h2>Data Pendaftar</h2>
    <p class="muted">Data diambil langsung dari Supabase.</p>
  </div>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button class="btn primary small" onclick="showAddPlayerForm()">
      + Tambah Pemain
    </button>

    <button class="btn primary small" onclick="loadPlayers()">
      ↻ Refresh
    </button>
  </div>
</div>
<div id="addPlayerForm" style="display:none; margin:20px 0; padding:20px; border:1px solid #ddd; border-radius:12px;">

  <h3 style="margin-top:0;">Tambah Pemain</h3>

  <form onsubmit="addPlayer(event)">

    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:15px;">

      <div>
        <label for="playerName">Nama Lengkap</label>
        <input
          type="text"
          id="playerName"
          required
          placeholder="Nama pemain"
        >
      </div>

      <div>
        <label for="playerPhone">WhatsApp</label>
        <input
          type="text"
          id="playerPhone"
          required
          placeholder="08xxxxxxxxxx"
        >
      </div>

      <div>
        <label for="playerProgram">Program</label>
        <select id="playerProgram" required>
          <option value="">Pilih program</option>
          <option value="Junior">Junior</option>
          <option value="Youth">Youth</option>
          <option value="Senior">Senior</option>
        </select>
      </div>

      <div>
        <label for="playerPosition">Posisi</label>
        <select id="playerPosition">
          <option value="">Pilih posisi</option>
          <option value="Kiper">Kiper</option>
          <option value="Anchor">Anchor</option>
          <option value="Flank">Flank</option>
          <option value="Pivot">Pivot</option>
        </select>
      </div>

      <div>
        <label for="playerJersey">Nomor Jersey</label>
        <input
          type="number"
          id="playerJersey"
          min="1"
          max="99"
          placeholder="Contoh: 10"
        >
      </div>

      <div>
        <label for="playerBirthDate">Tanggal Lahir</label>
        <input
          type="date"
          id="playerBirthDate"
        >
      </div>

    </div>

    <div style="margin-top:15px;">
      <label for="playerNotes">Catatan</label>
      <textarea
        id="playerNotes"
        rows="3"
        placeholder="Catatan pemain (opsional)"
      ></textarea>
    </div>

    <div style="display:flex; gap:10px; margin-top:15px;">

      <button type="submit" class="btn primary">
        Simpan Pemain
      </button>

      <button
        type="button"
        class="btn"
        onclick="hideAddPlayerForm()"
      >
        Batal
      </button>

    </div>

    <p id="addPlayerMessage" class="form-note"></p>

  </form>

</div>
      <div id="loading" class="muted">
        Memuat data...
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>WhatsApp</th>
              <th>Program</th>
              <th>Tanggal Daftar</th>
            </tr>
          </thead>

          <tbody id="playersTable">
          </tbody>
        </table>
      </div>

      <p id="message" class="form-note"></p>

    </section>

  </main>

<script>
const SUPABASE_URL = 'https://txgwdcxsmgclbgbxdbsf.supabase.co';

const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_g3Tsr8PRmwhGvFcGGJOuOg_0R6zCrr6';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   CEK LOGIN
========================= */

async function checkAuth() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  // Belum login
  if (!session) {
    window.location.href = 'login.html';
    return false;
  }

  // Cek apakah akun ini terdaftar sebagai admin
  const { data: admin, error } = await supabaseClient
    .from('admin_users')
    .select('user_id')
    .eq('user_id', session.user.id)
    .maybeSingle();

  // Bukan admin
  if (error || !admin) {
    await supabaseClient.auth.signOut();

    alert('Akun ini tidak memiliki akses admin.');

    window.location.href = 'login.html';

    return false;
  }

  return true;
}

/* =========================
   FORM TAMBAH PEMAIN
========================= */

function showAddPlayerForm() {
  document.getElementById('addPlayerForm').style.display = 'block';
  document.getElementById('playerName').focus();
}

function hideAddPlayerForm() {
  document.getElementById('addPlayerForm').style.display = 'none';
  document.getElementById('addPlayerMessage').textContent = '';
}

async function addPlayer(event) {

  event.preventDefault();

  const message = document.getElementById('addPlayerMessage');

  message.textContent = 'Menyimpan data...';

  const player = {
    full_name: document.getElementById('playerName').value.trim(),
    phone: document.getElementById('playerPhone').value.trim(),
    program: document.getElementById('playerProgram').value,
    position: document.getElementById('playerPosition').value || null,
    jersey_number: document.getElementById('playerJersey').value
      ? Number(document.getElementById('playerJersey').value)
      : null,
    birth_date: document.getElementById('playerBirthDate').value || null,
    notes: document.getElementById('playerNotes').value.trim() || null
  };

  const { error } = await supabaseClient
    .from('players')
    .insert([player]);

  if (error) {
    message.textContent = 'Gagal menyimpan: ' + error.message;
    return;
  }

  alert('Pemain berhasil ditambahkan.');

  document.querySelector('#addPlayerForm form').reset();

  hideAddPlayerForm();

  await loadPlayers();
}
/* =========================
   LOAD DATA PEMAIN
========================= */

async function loadPlayers() {

  const loading = document.getElementById('loading');
  const table = document.getElementById('playersTable');
  const message = document.getElementById('message');

  loading.textContent = 'Memuat data...';
  table.innerHTML = '';
  message.textContent = '';

  const { data, error } = await supabaseClient
    .from('players')
    .select('id, full_name, phone, program, position, jersey_number, birth_date, notes, created_at')
    .order('created_at', { ascending: false });

  if (error) {

    loading.textContent = '';

    message.textContent =
      'Gagal mengambil data: ' + error.message;

    return;
  }

  loading.textContent = '';

  document.getElementById('totalPlayers').textContent =
    data.length;

  document.getElementById('newPlayers').textContent =
    data.length;

  if (data.length === 0) {

    table.innerHTML =
      '<tr><td colspan="4">Belum ada data pendaftar.</td></tr>';

    return;
  }

  data.forEach(player => {

    const row = document.createElement('tr');

    const date = player.created_at
      ? new Date(player.created_at).toLocaleDateString('id-ID')
      : '-';

  row.innerHTML = `
  <td>${escapeHtml(player.full_name || '-')}</td>
  <td>${escapeHtml(player.phone || '-')}</td>
  <td>${escapeHtml(player.program || '-')}</td>
  <td>${date}</td>
  <td>
    <button
      class="btn primary small"
      onclick="editPlayer('${player.id}')">
      Edit
    </button>
  </td>
`;
    table.appendChild(row);
  });
}


/* =========================
   CEGAH HTML INJECTION
========================= */

function escapeHtml(value) {

  const div = document.createElement('div');

  div.textContent = value;

  return div.innerHTML;
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = 'login.html';
}


/* =========================
   JALANKAN
========================= */

(async function () {

  const authenticated = await checkAuth();

  if (authenticated) {
    await loadPlayers();
  }

})();
</script>

</body>
</html>
