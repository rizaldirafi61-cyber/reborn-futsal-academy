<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login Admin - Reborn Futsal Academy</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">

  <a class="back" href="index.html">← Kembali ke website</a>

  <div class="auth-card">

    <div class="brand center">
      <span class="brand-mark">RFA</span>
      <span>
        <strong>Reborn</strong>
        <small>Futsal Academy</small>
      </span>
    </div>

    <h1>Login Admin</h1>
    <p class="auth-subtitle">
      Masuk untuk mengelola data pemain Reborn Futsal Academy.
    </p>

    <form id="loginForm">

      <label for="email">Email Admin</label>
      <input
        id="email"
        type="email"
        placeholder="admin@email.com"
        required
        autocomplete="email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Masukkan password"
        required
        autocomplete="current-password"
      >

      <button class="btn primary full" type="submit">
        Login Admin →
      </button>

      <p id="loginMessage" class="form-note"></p>

    </form>

  </div>

<script>
const SUPABASE_URL = 'https://txgwdcxsmgclbgbxdbsf.supabase.co';

/*
  Tempel Publishable Key Supabase Anda di bawah.
  JANGAN gunakan Secret Key / service_role key.
*/
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_g3Tsr8PRmwhGvFcGGJOuOg_0R6zCrr6';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loginForm = document.getElementById('loginForm');
const loginMessage = document.getElementById('loginMessage');

loginForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  loginMessage.textContent = 'Sedang memproses...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    loginMessage.textContent =
      'Login gagal. Email atau password salah.';
    return;
  }

if (data.session) {

  const userId = data.session.user.id;

  console.log('LOGIN BERHASIL');
  console.log('User ID:', userId);

  // Cek Admin
  const {
    data: admin,
    error: adminError
  } = await supabaseClient
    .from('admin_users')
    .select('user_id')
    .eq('user_id', userId)
    .maybeSingle();

  console.log('Admin:', admin);
  console.log('Admin Error:', adminError);

  if (admin) {
    window.location.href = 'admin.html';
    return;
  }

 // Jika bukan Admin, masuk ke Management
window.location.href = 'management.html';
return;
});
</script>

</body>
</html>
